name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: List repo structure
        run: |
          echo "=== Root folder contents ==="
          ls -la
          echo ""
          echo "=== Looking for .csproj files ==="
          find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"

      - name: Restore dependencies
        run: dotnet restore Raceday.csproj

      - name: Build main project
        run: dotnet build Raceday.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Raceday.Tests/Raceday.Tests.csproj --no-build --configuration Release --verbosity normal
        continue-on-error: true
