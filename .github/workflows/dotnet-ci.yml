name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore main project
        run: dotnet restore Raceday/Raceday.csproj

      - name: Restore test project
        run: dotnet restore Raceday.Tests/Raceday.Tests.csproj

      - name: Build main project
        run: dotnet build Raceday/Raceday.csproj --no-restore --configuration Release

      - name: Build test project
        run: dotnet build Raceday.Tests/Raceday.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Raceday.Tests/Raceday.Tests.csproj --no-build --configuration Release --verbosity normal
        
